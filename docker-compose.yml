# HearMind Docker Compose — 阿里云 ECS 一键部署
# 用法见 docs/DOCKER_DEPLOY.md

services:
  mysql:
    image: mysql:8.0
    container_name: hearmind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dovidioai
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - hearmind

  redis:
    image: redis:7-alpine
    container_name: hearmind-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hearmind

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hearmind-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./config:/app/config:ro
      - hearmind_storage:/app/storage
    expose:
      - "8080"
    networks:
      - hearmind

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hearmind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - hearmind

volumes:
  mysql_data:
  redis_data:
  hearmind_storage:

networks:
  hearmind:
    driver: bridge
