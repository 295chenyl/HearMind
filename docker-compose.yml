services:

  mysql:

    image: mysql:8.0

    container_name: hearmind-mysql

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: dovidioai

      TZ: Asia/Shanghai

    ports:

      - "3306:3306"

    volumes:

      - mysql_data:/var/lib/mysql

    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci



  redis:

    image: redis:7-alpine

    container_name: hearmind-redis

    ports:

      - "6379:6379"

    volumes:

      - redis_data:/data

    command: redis-server --appendonly yes



volumes:

  mysql_data:

  redis_data:

